on:
  push:
  pull_request:
  merge_group:
name: Test
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.5]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}
    # Windows throws false positives with linting because of CRLF / goimports incompat
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Run Setup
      run: make setup
    - name: install diffutils
      if: runner.os == 'macOS'
      run: brew install diffutils
    - name: Install protoc
      # NB: `v3` is a *branch* in this repo, not a tag, so it moved with every
      # push. This pins the commit that the v3.0.0 release points at.
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
      with:
        version: '28.3'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install protoc deps
      run: |
        go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
        go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
        go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
      shell: bash
    - name: golangci-lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.10.1
        args: --max-issues-per-linter=0 --max-same-issues=0
    - name: Error category lint
      run: go run ./internal/lint/errorcategory/cmd ./...
      shell: bash
    - name: Run Tests
      run: make ci
      shell: bash
