name: release

on:
  push:
    tags:
      - "v*"

# No workflow-wide permissions: each job below opts in to only what it needs.
# `contents: write` is limited to the three GoReleaser jobs that publish the
# release, and `id-token: write` to the single job that publishes to npm.
permissions: {}

jobs:
  canary-tests:
    uses: ./.github/workflows/canary-test.yml
    permissions:
      contents: read
    with:
      run_api_tests: true
    secrets:
      STRIPE_TEST_API_KEY: ${{ secrets.STRIPE_TEST_API_KEY }}

  approve-release:
    needs: [canary-tests]
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: echo "Release approved, proceeding."

  release-metadata:
    needs: [approve-release]
    runs-on: ubuntu-latest
    outputs:
      goreleaser-config-suffix: ${{ steps.version.outputs.goreleaser-config-suffix }}
      npm-dist-tag: ${{ steps.version.outputs.npm-dist-tag }}
    steps:
      - name: Determine release channel
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          if [[ ! "${major}" =~ ^[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [[ "${major}" == "1" ]]; then
            echo "goreleaser-config-suffix=-maintenance" >> "${GITHUB_OUTPUT}"
            echo "npm-dist-tag=v1" >> "${GITHUB_OUTPUT}"
          else
            echo "goreleaser-config-suffix=" >> "${GITHUB_OUTPUT}"
            echo "npm-dist-tag=latest" >> "${GITHUB_OUTPUT}"
          fi

  build-mac:
    needs: [release-metadata]
    runs-on: macos-latest
    permissions:
      contents: write # GoReleaser publishes the GitHub release
    steps:
      - name: Code checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_STRIPE_CLI_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_CLI_RELEASER_PRIVATE_KEY }}
          owner: stripe
          repositories: |
            stripe-cli
            homebrew-stripe-cli
            scoop-stripe-cli
          # Request only what GoReleaser needs to commit the Homebrew formula.
          permission-contents: write
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          # Never restore a cache into a job that publishes release artifacts.
          cache: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release -f .goreleaser/mac${{ needs.release-metadata.outputs.goreleaser-config-suffix }}.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  build-linux:
    needs: [release-metadata]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # GoReleaser publishes the GitHub release
    env:
      # https://goreleaser.com/customization/docker_manifest/
      DOCKER_CLI_EXPERIMENTAL: "enabled"

    steps:
      - name: Code checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          # Never restore a cache into a job that publishes release artifacts.
          cache: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release -f .goreleaser/linux${{ needs.release-metadata.outputs.goreleaser-config-suffix }}.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTORY_SECRET: ${{ secrets.ARTIFACTORY_SECRET }}

  build-windows:
    needs: [release-metadata]
    runs-on: windows-latest
    permissions:
      contents: write # GoReleaser publishes the GitHub release
    steps:
      - name: Code checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GH_APP_STRIPE_CLI_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_CLI_RELEASER_PRIVATE_KEY }}
          owner: stripe
          repositories: |
            stripe-cli
            homebrew-stripe-cli
            scoop-stripe-cli
          # Request only what GoReleaser needs to commit the Scoop manifest.
          permission-contents: write
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.5
          # Never restore a cache into a job that publishes release artifacts.
          cache: false
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release -f .goreleaser/windows${{ needs.release-metadata.outputs.goreleaser-config-suffix }}.yml --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The GitHub App token is scoped to the stripe org and cannot create
          # PRs on microsoft/winget-pkgs, so winget still requires a PAT.
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}

  upload-to-virustotal:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read # only reads release assets
    steps:
      - name: Code checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Upload to VirusTotal
        run: scripts/upload-zip-to-virustotal.sh
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  publish-npm:
    needs: [release-metadata, build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read # downloads release assets
      id-token: write # required for OIDC to npm
    steps:
      - name: Code checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "${GITHUB_ENV}"

      - name: Download and extract platform binaries from GitHub Release
        run: node npm/scripts/fetch-binaries.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}

      - name: Stamp version into all package.json files
        # VERSION comes from GITHUB_ENV above; read it as a shell variable so a
        # crafted tag name cannot expand into the command line.
        run: node npm/scripts/stamp-version.js "$VERSION"

      - name: Copy README into each package
        run: |
          for dir in wrapper darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cp README.md npm/$dir/README.md
          done

      - name: Publish platform packages
        env:
          NPM_DIST_TAG: ${{ needs.release-metadata.outputs.npm-dist-tag }}
        run: |
          for dir in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish ./npm/$dir --tag "${NPM_DIST_TAG}"
          done

      - name: Publish wrapper package
        env:
          NPM_DIST_TAG: ${{ needs.release-metadata.outputs.npm-dist-tag }}
        run: npm publish ./npm/wrapper --tag "${NPM_DIST_TAG}"
