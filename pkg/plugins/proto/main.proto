syntax = "proto3";
package proto;

option go_package = "github.com/stripe/stripe-cli/plugins/proto";

service Main {
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  // PostInstall is called best-effort after `stripe plugins install` or
  // `stripe plugins upgrade` successfully downloads the plugin binary.
  rpc PostInstall(PostInstallRequest) returns (PostInstallResponse);
  // PreUninstall is called best-effort by `stripe plugins uninstall` before
  // the plugin's files are removed from disk.
  rpc PreUninstall(PreUninstallRequest) returns (PreUninstallResponse);
}

message RunCommandRequest {
  AdditionalInfo additional_info = 1;
  repeated string args = 2;
  uint32 core_cli_helper_id = 3;
}

message RunCommandResponse {
}

message PostInstallRequest {
  AdditionalInfo additional_info = 1;
  string version = 2;
  string previous_version = 3;
  uint32 core_cli_helper_id = 4;
}

message PostInstallResponse {
}

message PreUninstallRequest {
  AdditionalInfo additional_info = 1;
  string version = 2;
  uint32 core_cli_helper_id = 3;
}

message PreUninstallResponse {
}

message AdditionalInfo {
  IsTerminal is_terminal = 1;
  TerminalDimensions terminal_dimensions = 2;
}

message IsTerminal {
  bool stdin = 1;
  bool stdout = 2;
  bool stderr = 3;
}

message TerminalDimensions {
  uint32 width = 1;
  uint32 height = 2;
}

service CoreCLIHelper {
  rpc Echo(EchoRequest) returns (EchoResponse);
  rpc SendAnalytics(SendAnalyticsRequest) returns (SendAnalyticsResponse);
  rpc KeychainGetPassword(KeychainGetPasswordRequest) returns (KeychainGetPasswordResponse);
  rpc KeychainSetPassword(KeychainSetPasswordRequest) returns (KeychainSetPasswordResponse);
  rpc KeychainDeletePassword(KeychainDeletePasswordRequest) returns (KeychainDeletePasswordResponse);
  // Deprecated: KeychainFindCredentials always returns an empty list. Use KeychainGetPassword to retrieve an individual password instead.
  rpc KeychainFindCredentials(KeychainFindCredentialsRequest) returns (KeychainFindCredentialsResponse) {
    option deprecated = true;
  };
  rpc RunPeerPlugin(RunPeerPluginRequest) returns (RunPeerPluginResponse);
  rpc ResolveCredentials(ResolveCredentialsRequest) returns (ResolveCredentialsResponse);
  // Resolves credentials for the requested mode, but if that doesn't match the
  // OAuth active context, resolves credentials for whichever mode is actually
  // active instead of failing.
  rpc ResolveCredentialsForAnyMode(ResolveCredentialsRequest) returns (ResolveCredentialsResponse);
  // SwitchContext switches the active authorized account/mode context, the
  // same way `stripe switch context` does. If account_id is empty, shows an
  // interactive picker.
  rpc SwitchContext(SwitchContextRequest) returns (SwitchContextResponse);
}

message EchoRequest {
  string input = 1;
}

message EchoResponse {
  string output = 1;
}

message SendAnalyticsRequest {
  string event_name = 1;
  string event_value = 2;
}

message SendAnalyticsResponse {
}

message KeychainGetPasswordRequest {
  string key = 1;
}

message KeychainGetPasswordResponse {
  string value = 1;
  bool found = 2;
}

message KeychainSetPasswordRequest {
  string key = 1;
  string value = 2;
}

message KeychainSetPasswordResponse {
}

message KeychainDeletePasswordRequest {
  string key = 1;
}

message KeychainDeletePasswordResponse {
  bool deleted = 1;
}

// Deprecated: KeychainFindCredentials always returns an empty list. Use KeychainGetPassword to retrieve an individual password instead.
message KeychainFindCredentialsRequest {
  option deprecated = true;
}

// Deprecated: KeychainFindCredentials always returns an empty list. Use KeychainGetPassword to retrieve an individual password instead.
message KeychainFindCredentialsResponse {
  option deprecated = true;
  repeated string keys = 1;
}

message RunPeerPluginRequest {
  string plugin_name = 1;
  repeated string args = 2;
  string cwd = 3;
}

message RunPeerPluginResponse {
}

message ResolveCredentialsRequest {
  bool livemode = 1;
}

message ResolveCredentialsResponse {
  string token = 1;
  string stripe_context = 2;
  bool livemode = 3;
}

message SwitchContextRequest {
  string account_id = 1;
  bool livemode = 2;
}

message SwitchContextResponse {
  string account_id = 1;
  string account_name = 2;
  bool livemode = 3;
  // switched is false if the user cancelled an interactive picker; in that
  // case the other fields are empty.
  bool switched = 4;
}
